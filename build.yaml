# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano@2.0.0//zmk
#     shield: reviung41
#
---
include:
  # DIAGNOSTIC: the snippet supplies the cdc-acm-uart node the console needs.
  # Setting CONFIG_ZMK_USB_LOGGING by hand fails Kconfig -- it selects
  # UART_INTERRUPT_DRIVEN, which needs SERIAL_SUPPORT_INTERRUPT, which is only
  # true once a UART exists in the devicetree. Left half only.
  - board: nice_nano@2.0.0//zmk
    shield: chocofi_left
    snippet: zmk-usb-logging
  - board: nice_nano@2.0.0//zmk
    shield: chocofi_right
