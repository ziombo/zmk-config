# Oled display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Idle after 4min, Deep Sleep after 15min of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=240000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Combo config, automated by build script
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# Mouse emulation for the mouse layer (formerly CONFIG_ZMK_MOUSE)
CONFIG_ZMK_POINTING=y


# Stronger bt signal
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Max paired channels
CONFIG_BT_MAX_PAIRED=4
# Bluetooth tweaks
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# EXPERIMENTAL_CONN's only current effect is `BT_CTLR_PHY_2M default n`, which
# doubles airtime per packet. The central runs two links on one radio (host +
# split peripheral), so that halves the scheduler's slack and the host link is
# the one that loses arbitration -- which matches the stalls being host-only.
# Overridden here rather than by clearing EXPERIMENTAL_CONN, so any stability
# settings ZMK folds into that flag later still apply. Range cost is ~2-3 dB,
# irrelevant at under a meter.
CONFIG_BT_CTLR_PHY_2M=y

# DIAGNOSTIC BUILD -- not for permanent use. Logs over USB CDC ACM so the host
# link can be watched during a stall. Pair with &out OUT_BLE on the sys layer
# to keep output on BLE while USB supplies power, which separates a failing
# radio link from a sagging battery: on USB both are powered, so plain "works
# on cable" cannot tell them apart.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_BT_LOG_LEVEL_INF=y

# Better battery display in Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n