# Oled display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Custom status screen, see src/custom_status_screen.c. Selecting this drops
# ZMK's built-in screen, which is what implies/defaults everything below, so
# each has to be restored by hand. Missing the theme or the pool size builds
# fine and then dies at runtime -- no theme means lv_theme_get_font_small()
# dereferences NULL, and 2048 bytes is too small a pool to lay the screen out.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# Idle after 4min, Deep Sleep after 15min of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=240000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Combo config, automated by build script
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3


# Stronger bt signal
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Max paired channels
CONFIG_BT_MAX_PAIRED=4
# Bluetooth tweaks
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Better battery display in Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n