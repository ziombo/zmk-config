name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - config/**
      - build.yaml

jobs:
  build:
    # Must match the ZMK revision pinned in config/west.yml. The @main workflow
    # assumes Zephyr 4.1 and fails against the v0.3 (Zephyr 3.5) tree.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
